[project]
name = "quantlab"
version = "0.1.0"
description = "Personal quantitative finance laboratory and paper-trading simulator for the Russian market"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]
quant = ["numpy", "pandas", "scipy", "statsmodels", "arch", "matplotlib"]

[project.scripts]
qlab = "quantlab.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantlab*"]
